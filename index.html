<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#6B0F0F">
  <title>文言文学习 · 考试必背</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #9B1B1B;
      --dark-red: #6B0F0F;
      --gold: #C9A227;
      --cream: #F8F1E3;
      --paper: #F3EBD8;
      --ink: #2C1A0E;
      --light-ink: #5C4033;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: linear-gradient(135deg, #3a1c0f 0%, #1a0a05 100%);
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: var(--cream);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5),
                  inset 0 0 0 6px var(--gold),
                  inset 0 0 0 10px var(--dark-red);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      .app { max-width: 520px; }
      body { padding: 24px; }
    }

    @media (min-width: 1200px) {
      .app { max-width: 560px; }
    }

    .header {
      background: linear-gradient(to right, var(--dark-red), var(--red), var(--dark-red));
      color: var(--gold);
      text-align: center;
      padding: 18px 16px 14px;
      flex-shrink: 0;
    }

    .header h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .header .subtitle {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .nav {
      display: flex;
      background: var(--paper);
      border-bottom: 2px solid #e0d4b8;
      flex-shrink: 0;
    }

    .nav button {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: transparent;
      font-family: 'Noto Serif SC', serif;
      font-size: 14px;
      color: var(--light-ink);
      cursor: pointer;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    .nav button.active {
      color: var(--red);
      font-weight: 700;
    }

    .nav button.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 18%;
      width: 64%;
      height: 3px;
      background: var(--gold);
      border-radius: 2px;
    }

    .content {
      padding: 20px 16px 24px;
      flex: 1;
      overflow-y: auto;
    }

    .card-container {
      perspective: 1200px;
      height: 320px;
      margin-bottom: 16px;
    }

    @media (min-width: 400px) {
      .card-container { height: 340px; }
    }

    .flashcard {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .flashcard.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    .card-front {
      background: linear-gradient(145deg, #fffaf0, #f5e9d3);
      border: 2px solid var(--gold);
    }

    .card-back {
      background: linear-gradient(145deg, #f8f0e0, #efe2c8);
      border: 2px solid var(--red);
      transform: rotateY(180deg);
      justify-content: flex-start;
      padding-top: 20px;
      overflow-y: auto;
    }

    .char {
      font-family: 'Noto Serif SC', serif;
      font-size: 56px;
      font-weight: 700;
      color: var(--dark-red);
      line-height: 1.1;
      text-align: center;
    }

    @media (min-width: 400px) {
      .char { font-size: 64px; }
    }

    .back-pinyin {
      font-size: 17px;
      color: var(--light-ink);
      margin-bottom: 6px;
      letter-spacing: 2px;
    }

    .meaning {
      font-size: 16px;
      font-weight: 500;
      color: var(--ink);
      text-align: center;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .example-box {
      width: 100%;
      border-top: 1px dashed #c9b98a;
      padding-top: 10px;
      margin-top: 4px;
    }

    .example-label, .note-label {
      font-size: 12px;
      color: var(--red);
      font-weight: 500;
      margin-bottom: 3px;
    }

    .example-text {
      font-size: 14px;
      color: var(--ink);
      line-height: 1.55;
      margin-bottom: 10px;
    }

    .note-text {
      font-size: 13px;
      color: var(--light-ink);
      line-height: 1.5;
    }

    .highlight {
      color: var(--red);
      font-weight: 700;
      background: rgba(155, 27, 27, 0.12);
      padding: 0 3px;
      border-radius: 3px;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 30px;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
      -webkit-tap-highlight-color: transparent;
      min-height: 42px;
    }

    .btn-primary {
      background: var(--red);
      color: #fff;
      box-shadow: 0 4px 12px rgba(155, 27, 27, 0.3);
    }

    .btn-primary:hover { background: var(--dark-red); }

    .btn-secondary {
      background: transparent;
      color: var(--red);
      border: 2px solid var(--red);
    }

    .btn-secondary:hover { background: rgba(155, 27, 27, 0.08); }

    .progress-text {
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
      color: var(--light-ink);
    }

    .tip-text {
      text-align: center;
      font-size: 12px;
      color: #a08b6a;
      margin-top: 6px;
    }

    .quiz-question {
      font-family: 'Noto Serif SC', serif;
      font-size: 18px;
      text-align: center;
      margin-bottom: 18px;
      color: var(--dark-red);
      line-height: 1.4;
    }

    .options { display: flex; flex-direction: column; gap: 10px; }

    .option {
      padding: 12px 14px;
      background: #fff;
      border: 2px solid #e5d9b8;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .option:hover { border-color: var(--gold); background: #fffaf0; }
    .option.correct { background: #e8f5e9; border-color: #4caf50; color: #2e7d32; }
    .option.wrong { background: #ffebee; border-color: #ef5350; color: #c62828; }

    .quiz-result {
      text-align: center;
      margin-top: 16px;
      font-size: 16px;
      font-weight: 500;
    }

    .section-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 16px;
      color: var(--dark-red);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .word-list {
      max-height: 55vh;
      overflow-y: auto;
      margin-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .word-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px;
      border-bottom: 1px solid #e8dcc0;
      gap: 8px;
    }

    .word-left { flex: 1; min-width: 0; }
    .word-char { font-family: 'Noto Serif SC', serif; font-size: 16px; color: var(--dark-red); }
    .word-pinyin { font-size: 12px; color: var(--light-ink); }
    .word-meaning { font-size: 13px; color: var(--ink); margin-top: 2px; }

    .empty-tip {
      text-align: center;
      color: var(--light-ink);
      font-size: 14px;
      padding: 30px 0;
    }

    .footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #a08b6a;
      background: var(--paper);
      border-top: 1px solid #e0d4b8;
      flex-shrink: 0;
    }

    .hidden { display: none !important; }

    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
      background: #f0e6d0;
      color: var(--light-ink);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>文言文学习</h1>
      <div class="subtitle">考试必背高频词</div>
    </div>

    <div class="nav">
      <button class="active" onclick="switchTab('flashcard')">闪卡</button>
      <button onclick="switchTab('quiz')">测验</button>
      <button onclick="switchTab('list')">词库</button>
    </div>

    <div class="content">
      <!-- 闪卡 -->
      <div id="flashcard-tab">
        <div class="card-container">
          <div class="flashcard" id="flashcard" onclick="flipCard()">
            <div class="card-face card-front">
              <div class="char" id="front-char">顾</div>
            </div>
            <div class="card-face card-back">
              <div class="back-pinyin" id="back-pinyin">gù</div>
              <div class="meaning" id="back-meaning">回头看；只是、但</div>
              <div class="example-box">
                <div class="example-label">例句</div>
                <div class="example-text" id="back-example"></div>
                <div class="note-label">注释</div>
                <div class="note-text" id="back-note"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn btn-secondary" onclick="prevCard()">上一个</button>
          <button class="btn btn-primary" onclick="nextCard()">下一个</button>
        </div>
        <div class="progress-text" id="progress-text">第 1 / 38 个</div>
        <div class="tip-text">点击卡片翻转查看意思、例句和注释</div>
      </div>

      <!-- 测验 -->
      <div id="quiz-tab" class="hidden">
        <div class="quiz-question" id="quiz-question">「顾」的常见意思是？</div>
        <div class="options" id="quiz-options"></div>
        <div class="quiz-result" id="quiz-result"></div>
        <div style="text-align:center; margin-top: 18px;">
          <button class="btn btn-primary" onclick="nextQuiz()" id="next-quiz-btn" style="display:none;">下一题</button>
        </div>
      </div>

      <!-- 词库 -->
      <div id="list-tab" class="hidden">
        <div class="section-title">
          <span>全部卡牌</span>
          <span style="font-size:13px; color:var(--light-ink);" id="total-count">共 0 个</span>
        </div>
        <div class="word-list" id="word-list"></div>
      </div>
    </div>

    <div class="footer">温故而知新 · 可以为师矣</div>
  </div>

  <script>
    const defaultWords = [
      { char: "顾", pinyin: "gù", meaning: "回头看；只是、但", example: "三顾茅庐", note: "这里的「顾」是拜访、看望的意思。" },
      { char: "走", pinyin: "zǒu", meaning: "跑", example: "弃甲曳兵而走", note: "「走」在文言文中多表示奔跑，与现代汉语不同。" },
      { char: "去", pinyin: "qù", meaning: "离开；距离", example: "距圆明园十里，有村曰谢庄", note: "「去」常表示离开某地，或表示距离。" },
      { char: "亡", pinyin: "wáng", meaning: "逃跑；死亡；失去", example: "今亡亦死，举大计亦死", note: "此处「亡」是逃亡、逃跑的意思。" },
      { char: "绝", pinyin: "jué", meaning: "断；停止；极、非常；与世隔绝", example: "率妻子邑人来此绝境", note: "「绝境」指与世隔绝的地方。" },
      { char: "益", pinyin: "yì", meaning: "更加；好处；增加", example: "香远益清", note: "「益」在这里是更加的意思。" },
      { char: "尝", pinyin: "cháng", meaning: "曾经", example: "予尝求古仁人之心", note: "「尝」表示曾经，是时间副词。" },
      { char: "方", pinyin: "fāng", meaning: "正在；才；方法", example: "方欲行", note: "「方」在这里表示正在、正要。" },
      { char: "适", pinyin: "shì", meaning: "恰好；到……去", example: "适为虞人驱", note: "「适」可表示到……去，或恰好。" },
      { char: "但", pinyin: "dàn", meaning: "只；仅仅", example: "但闻黄河流水鸣溅溅", note: "「但」在文言文中常表示只、仅仅。" },
      { char: "徒", pinyin: "tú", meaning: "只；仅仅；白白地", example: "徒有虚名", note: "「徒」表示仅仅、空有。" },
      { char: "悉", pinyin: "xī", meaning: "全部；都", example: "悉使赢兵负草填之", note: "「悉」表示全部、都。" },
      { char: "皆", pinyin: "jiē", meaning: "都；全都", example: "皆若空游无所依", note: "「皆」是范围副词，表示都。" },
      { char: "具", pinyin: "jù", meaning: "具备；准备；详加", example: "故人具鸡黍", note: "「具」在这里是准备、置办的意思。" },
      { char: "复", pinyin: "fù", meaning: "又；再；恢复", example: "复前行，欲穷其林", note: "「复」表示又、再。" },
      { char: "乃", pinyin: "nǎi", meaning: "于是；才；竟然", example: "见渔人，乃大惊", note: "「乃」常表示于是、就。" },
      { char: "遂", pinyin: "suì", meaning: "于是；就", example: "遂至承天寺寻张怀民", note: "「遂」表示于是、就，表承接。" },
      { char: "固", pinyin: "gù", meaning: "本来；当然；坚固", example: "汝心之固，固不可彻", note: "前一个「固」是顽固，后一个是本来。" },
      { char: "诚", pinyin: "chéng", meaning: "确实；的确；真诚", example: "此诚危急存亡之秋也", note: "「诚」在这里是确实、实在的意思。" },
      { char: "甚", pinyin: "shèn", meaning: "很；非常；超过", example: "言之无文，行而不远", note: "「甚」表示程度深，很、非常。" },
      { char: "颇", pinyin: "pō", meaning: "很；稍微", example: "颇有野趣", note: "「颇」可表示很，也可表示稍微。" },
      { char: "怪", pinyin: "guài", meaning: "感到奇怪；以……为怪", example: "怪之", note: "「怪」作动词时表示对……感到奇怪。" },
      { char: "易", pinyin: "yì", meaning: "容易；交换；改变", example: "寒暑易节", note: "「易」在这里是交换、改变的意思。" },
      { char: "谢", pinyin: "xiè", meaning: "道歉；辞别；感谢", example: "长跪而谢之", note: "「谢」在这里是道歉的意思。" },
      { char: "遗", pinyin: "yí", meaning: "遗留；送给；丢失", example: "父母岁有裘葛之遗", note: "「遗」在这里是送给、赠送的意思。" },
      { char: "举", pinyin: "jǔ", meaning: "举起；提出；全、都", example: "举头望明月", note: "「举」在这里是抬起、举起的意思。" },
      { char: "莫", pinyin: "mò", meaning: "没有谁；不要；不", example: "莫等闲，白了少年头", note: "「莫」表示不要、不能。" },
      { char: "未", pinyin: "wèi", meaning: "没有；不曾；尚未", example: "未若柳絮因风起", note: "「未」表示没有、不曾。" },
      { char: "焉", pinyin: "yān", meaning: "于是；在哪里；语气词", example: "且焉置土石", note: "「焉」在这里是疑问代词，表示在哪里。" },
      { char: "其", pinyin: "qí", meaning: "他的；它的；难道；大概", example: "其如土石何", note: "「其」在这里加强反问语气。" },
      { char: "之", pinyin: "zhī", meaning: "的；他、它；去、往", example: "学而时习之", note: "「之」在这里是代词，指代学过的知识。" },
      { char: "而", pinyin: "ér", meaning: "并且；然后；却", example: "温故而知新", note: "「而」在这里表示承接，然后。" },
      { char: "以", pinyin: "yǐ", meaning: "用；因为；来、用来", example: "以中有足乐者", note: "「以」在这里表示因为。" },
      { char: "于", pinyin: "yú", meaning: "在；向、对；比", example: "苛政猛于虎也", note: "「于」在这里表示比较，比……还。" },
      { char: "为", pinyin: "wéi / wèi", meaning: "做、担任；是；被", example: "山峦为晴雪所洗", note: "「为……所」表示被动。" },
      { char: "者", pinyin: "zhě", meaning: "……的人；……的事物", example: "知之者不如好之者", note: "「者」是代词，指……的人。" },
      { char: "也", pinyin: "yě", meaning: "表示判断、陈述或语气", example: "此则岳阳楼之大观也", note: "「也」是语气助词，表示判断。" },
      { char: "乎", pinyin: "hū", meaning: "吗；呢；于", example: "吾与点也", note: "「乎」常用于疑问或感叹语气。" }
    ];

    let words = [];
    let currentIndex = 0;
    let isFlipped = false;
    let quizIndex = 0;
    let quizAnswered = false;

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function highlightWord(text, word) {
      if (!text) return '';
      // 简单替换，把关键字高亮
      return text.replace(new RegExp(word, 'g'), `<span class="highlight">${word}</span>`);
    }

    function loadWords() {
      words = [...defaultWords];
      shuffleArray(words);
      currentIndex = 0;
      quizIndex = 0;
    }

    function updateCard() {
      if (words.length === 0) return;

      const word = words[currentIndex];
      document.getElementById('front-char').textContent = word.char;
      document.getElementById('back-pinyin').textContent = word.pinyin || '';
      document.getElementById('back-meaning').textContent = word.meaning;
      
      // 例句高亮关键字
      document.getElementById('back-example').innerHTML = highlightWord(word.example, word.char);
      document.getElementById('back-note').textContent = word.note || '';

      document.getElementById('progress-text').textContent = `第 ${currentIndex + 1} / ${words.length} 个`;

      const card = document.getElementById('flashcard');
      card.classList.remove('flipped');
      isFlipped = false;
    }

    function flipCard() {
      if (words.length === 0) return;
      document.getElementById('flashcard').classList.toggle('flipped');
      isFlipped = !isFlipped;
    }

    function nextCard() {
      if (words.length === 0) return;
      currentIndex = (currentIndex + 1) % words.length;
      updateCard();
    }

    function prevCard() {
      if (words.length === 0) return;
      currentIndex = (currentIndex - 1 + words.length) % words.length;
      updateCard();
    }

    function loadQuiz() {
      if (words.length < 2) return;
      quizAnswered = false;
      document.getElementById('quiz-result').textContent = '';
      document.getElementById('next-quiz-btn').style.display = 'none';

      const word = words[quizIndex % words.length];
      const useMeaning = Math.random() > 0.35;
      let question, answer;

      if (useMeaning) {
        question = `「${word.char}」的常见意思是？`;
        answer = word.meaning;
      } else {
        question = `「${word.char}」的拼音是？`;
        answer = word.pinyin || '（无拼音）';
      }

      document.getElementById('quiz-question').textContent = question;

      let options = [answer];
      while (options.length < 4) {
        const random = words[Math.floor(Math.random() * words.length)];
        const candidate = useMeaning ? random.meaning : (random.pinyin || '（无拼音）');
        if (!options.includes(candidate)) options.push(candidate);
      }
      options = options.sort(() => Math.random() - 0.5);

      const optionsEl = document.getElementById('quiz-options');
      optionsEl.innerHTML = '';
      options.forEach(opt => {
        const div = document.createElement('div');
        div.className = 'option';
        div.textContent = opt;
        div.onclick = () => selectOption(div, opt, answer);
        optionsEl.appendChild(div);
      });
    }

    function selectOption(el, selected, correct) {
      if (quizAnswered) return;
      quizAnswered = true;
      document.querySelectorAll('.option').forEach(o => {
        o.style.pointerEvents = 'none';
        if (o.textContent === correct) o.classList.add('correct');
      });
      if (selected === correct) {
        el.classList.add('correct');
        document.getElementById('quiz-result').textContent = '✓ 回答正确！';
        document.getElementById('quiz-result').style.color = '#2e7d32';
      } else {
        el.classList.add('wrong');
        document.getElementById('quiz-result').textContent = '✗ 再接再厉';
        document.getElementById('quiz-result').style.color = '#c62828';
      }
      document.getElementById('next-quiz-btn').style.display = 'inline-block';
    }

    function nextQuiz() {
      quizIndex = (quizIndex + 1) % words.length;
      loadQuiz();
    }

    function renderWordList() {
      const list = document.getElementById('word-list');
      document.getElementById('total-count').textContent = `共 ${words.length} 个`;
      list.innerHTML = '';

      words.forEach((w) => {
        const item = document.createElement('div');
        item.className = 'word-item';
        item.innerHTML = `
          <div class="word-left">
            <div class="word-char">${w.char}</div>
            <div class="word-pinyin">${w.pinyin || ''}</div>
            <div class="word-meaning">${w.meaning}</div>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav button').forEach((btn, i) => {
        const names = ['flashcard', 'quiz', 'list'];
        btn.classList.toggle('active', names[i] === tab);
      });

      document.getElementById('flashcard-tab').classList.toggle('hidden', tab !== 'flashcard');
      document.getElementById('quiz-tab').classList.toggle('hidden', tab !== 'quiz');
      document.getElementById('list-tab').classList.toggle('hidden', tab !== 'list');

      if (tab === 'quiz') loadQuiz();
      if (tab === 'list') renderWordList();
      if (tab === 'flashcard') updateCard();
    }

    // 初始化
    loadWords();
    updateCard();
  </script>
</body>
</html>
