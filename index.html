<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#6B0F0F">
  <title>文言文学习 · 考试必背</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #9B1B1B;
      --dark-red: #6B0F0F;
      --gold: #C9A227;
      --cream: #F8F1E3;
      --paper: #F3EBD8;
      --ink: #2C1A0E;
      --light-ink: #5C4033;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: linear-gradient(135deg, #3a1c0f 0%, #1a0a05 100%);
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: var(--cream);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5),
                  inset 0 0 0 6px var(--gold),
                  inset 0 0 0 10px var(--dark-red);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      .app { max-width: 520px; }
      body { padding: 24px; }
    }

    @media (min-width: 1200px) {
      .app { max-width: 560px; }
    }

    .header {
      background: linear-gradient(to right, var(--dark-red), var(--red), var(--dark-red));
      color: var(--gold);
      text-align: center;
      padding: 18px 16px 14px;
      flex-shrink: 0;
    }

    .header h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .header .subtitle {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .nav {
      display: flex;
      background: var(--paper);
      border-bottom: 2px solid #e0d4b8;
      flex-shrink: 0;
    }

    .nav button {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: transparent;
      font-family: 'Noto Serif SC', serif;
      font-size: 15px;
      color: var(--light-ink);
      cursor: pointer;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    .nav button.active {
      color: var(--red);
      font-weight: 700;
    }

    .nav button.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20%;
      width: 60%;
      height: 3px;
      background: var(--gold);
      border-radius: 2px;
    }

    .content {
      padding: 20px 16px 24px;
      flex: 1;
      overflow-y: auto;
    }

    .card-container {
      perspective: 1200px;
      height: 300px;
      margin-bottom: 16px;
    }

    .flashcard {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .flashcard.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    .card-front {
      background: linear-gradient(145deg, #fffaf0, #f5e9d3);
      border: 2px solid var(--gold);
    }

    .card-back {
      background: linear-gradient(145deg, #f8f0e0, #efe2c8);
      border: 2px solid var(--red);
      transform: rotateY(180deg);
      justify-content: flex-start;
      padding-top: 20px;
    }

    .char {
      font-family: 'Noto Serif SC', serif;
      font-size: 62px;
      font-weight: 700;
      color: var(--dark-red);
      line-height: 1.1;
      text-align: center;
    }

    .meaning {
      font-size: 16px;
      font-weight: 500;
      color: var(--ink);
      text-align: center;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .example-box {
      width: 100%;
      border-top: 1px dashed #c9b98a;
      padding-top: 10px;
      text-align: center;
    }

    .example-label {
      font-size: 12px;
      color: #a08b6a;
      margin-bottom: 4px;
    }

    .example {
      font-size: 14px;
      color: var(--ink);
      line-height: 1.55;
      margin-bottom: 8px;
    }

    .translation {
      font-size: 13px;
      color: var(--light-ink);
      line-height: 1.5;
    }

    .highlight {
      color: var(--red);
      font-weight: 700;
      background: rgba(155, 27, 27, 0.08);
      padding: 0 2px;
      border-radius: 3px;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 30px;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
      -webkit-tap-highlight-color: transparent;
      min-height: 42px;
    }

    .btn-primary {
      background: var(--red);
      color: #fff;
      box-shadow: 0 4px 12px rgba(155, 27, 27, 0.3);
    }

    .btn-primary:hover { background: var(--dark-red); }

    .btn-secondary {
      background: transparent;
      color: var(--red);
      border: 2px solid var(--red);
    }

    .btn-secondary:hover { background: rgba(155, 27, 27, 0.08); }

    .progress-text {
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
      color: var(--light-ink);
    }

    .tip-text {
      text-align: center;
      font-size: 12px;
      color: #a08b6a;
      margin-top: 6px;
    }

    .quiz-question {
      font-family: 'Noto Serif SC', serif;
      font-size: 18px;
      text-align: center;
      margin-bottom: 18px;
      color: var(--dark-red);
      line-height: 1.4;
    }

    .options { display: flex; flex-direction: column; gap: 10px; }

    .option {
      padding: 12px 14px;
      background: #fff;
      border: 2px solid #e5d9b8;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .option:hover { border-color: var(--gold); background: #fffaf0; }
    .option.correct { background: #e8f5e9; border-color: #4caf50; color: #2e7d32; }
    .option.wrong { background: #ffebee; border-color: #ef5350; color: #c62828; }

    .quiz-result {
      text-align: center;
      margin-top: 16px;
      font-size: 16px;
      font-weight: 500;
    }

    .section-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 16px;
      color: var(--dark-red);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .word-list {
      max-height: 58vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .word-item {
      padding: 12px 6px;
      border-bottom: 1px solid #e8dcc0;
    }

    .word-char {
      font-family: 'Noto Serif SC', serif;
      font-size: 18px;
      color: var(--dark-red);
      margin-bottom: 4px;
    }

    .word-meaning {
      font-size: 14px;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .word-example {
      font-size: 13px;
      color: var(--ink);
      line-height: 1.5;
      margin-bottom: 2px;
    }

    .word-translation {
      font-size: 12px;
      color: var(--light-ink);
      line-height: 1.4;
    }

    .footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #a08b6a;
      background: var(--paper);
      border-top: 1px solid #e0d4b8;
      flex-shrink: 0;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>文言文学习</h1>
      <div class="subtitle">考试必背高频词 · 例句 + 译文</div>
    </div>

    <div class="nav">
      <button class="active" onclick="switchTab('flashcard')">闪卡</button>
      <button onclick="switchTab('quiz')">测验</button>
      <button onclick="switchTab('list')">词库</button>
    </div>

    <div class="content">
      <!-- 闪卡 -->
      <div id="flashcard-tab">
        <div class="card-container">
          <div class="flashcard" id="flashcard" onclick="flipCard()">
            <div class="card-face card-front">
              <div class="char" id="front-char">顾</div>
            </div>
            <div class="card-face card-back">
              <div class="meaning" id="back-meaning">回头看；只是、但</div>
              <div class="example-box">
                <div class="example-label">例句</div>
                <div class="example" id="back-example"></div>
                <div class="example-label">译文</div>
                <div class="translation" id="back-translation"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn btn-secondary" onclick="prevCard()">上一个</button>
          <button class="btn btn-primary" onclick="nextCard()">下一个</button>
        </div>
        <div class="progress-text" id="progress-text">第 1 / 38 个</div>
        <div class="tip-text">点击卡片翻转查看意思、例句和译文</div>
      </div>

      <!-- 测验 -->
      <div id="quiz-tab" class="hidden">
        <div class="quiz-question" id="quiz-question">「顾」的常见意思是？</div>
        <div class="options" id="quiz-options"></div>
        <div class="quiz-result" id="quiz-result"></div>
        <div style="text-align:center; margin-top: 18px;">
          <button class="btn btn-primary" onclick="nextQuiz()" id="next-quiz-btn" style="display:none;">下一题</button>
        </div>
      </div>

      <!-- 词库 -->
      <div id="list-tab" class="hidden">
        <div class="section-title">
          <span>全部必背词</span>
          <span style="font-size:13px; color:var(--light-ink);" id="total-count">共 38 个</span>
        </div>
        <div class="word-list" id="word-list"></div>
      </div>
    </div>

    <div class="footer">温故而知新 · 可以为师矣</div>
  </div>

  <script>
    const words = [
      { char: "顾", meaning: "回头看；只是、但", example: "三顾臣于草庐之中。", translation: "三次到草庐中拜访我。" },
      { char: "走", meaning: "跑", example: "弃甲曳兵而走。", translation: "丢掉铠甲拖着兵器逃跑。" },
      { char: "去", meaning: "离开；距离", example: "大江东去，浪淘尽。", translation: "大江向东流去，波浪淘尽英雄。" },
      { char: "亡", meaning: "逃跑；死亡；失去", example: "今亡亦死，举大计亦死。", translation: "现在逃跑也是死，发动大事也是死。" },
      { char: "绝", meaning: "断；停止；极、非常；与世隔绝", example: "率妻子邑人来此绝境。", translation: "带领妻子儿女和乡亲来到这与世隔绝的地方。" },
      { char: "益", meaning: "更加；好处；增加", example: "香远益清，亭亭净植。", translation: "香气远播更加清幽，笔直洁净地立在水中。" },
      { char: "尝", meaning: "曾经", example: "仲永生五年，未尝识书具。", translation: "仲永长到五岁，还不曾见过书写工具。" },
      { char: "方", meaning: "正在；才；方法", example: "方欲行，转视积薪后。", translation: "正要走的时候，转身看见柴堆后面。" },
      { char: "适", meaning: "恰好；到……去", example: "适得君府书。", translation: "恰好收到您府上的来信。" },
      { char: "但", meaning: "只；仅仅", example: "但闻黄河流水鸣溅溅。", translation: "只听见黄河流水溅溅作响。" },
      { char: "徒", meaning: "只；仅仅；白白地", example: "少壮不努力，老大徒伤悲。", translation: "年轻时不努力，老了只能白白伤心。" },
      { char: "悉", meaning: "全部；都", example: "悉使赢兵负草填之。", translation: "全部让瘦弱的士兵背草去填。" },
      { char: "皆", meaning: "都；全都", example: "皆若空游无所依。", translation: "都好像在空中游动，没有什么依靠。" },
      { char: "具", meaning: "具备；准备；详加", example: "故人具鸡黍，邀我至田家。", translation: "老朋友准备了鸡和黄米饭，邀请我到农家。" },
      { char: "复", meaning: "又；再；恢复", example: "复前行，欲穷其林。", translation: "又向前走，想走到那片林子的尽头。" },
      { char: "乃", meaning: "于是；才；竟然", example: "乃重修岳阳楼，增其旧制。", translation: "于是重新修建岳阳楼，扩大它原有的规模。" },
      { char: "遂", meaning: "于是；就", example: "遂与外人间隔。", translation: "于是就和外面的人隔绝了。" },
      { char: "固", meaning: "本来；当然；坚固", example: "汝心之固，固不可彻。", translation: "你思想顽固，本来就无法开导。" },
      { char: "诚", meaning: "确实；的确；真诚", example: "此诚危急存亡之秋也。", translation: "这确实是危急存亡的关键时刻。" },
      { char: "甚", meaning: "很；非常；超过", example: "所言甚是。", translation: "说的话很对。" },
      { char: "颇", meaning: "很；稍微", example: "颇有名气。", translation: "很有名气。" },
      { char: "怪", meaning: "感到奇怪；以……为怪", example: "怪之，不敢发。", translation: "感到奇怪，不敢发动。" },
      { char: "易", meaning: "容易；交换；改变", example: "寒暑易节，始一反焉。", translation: "冬夏换季，才往返一次。" },
      { char: "谢", meaning: "道歉；辞别；感谢", example: "使君谢罗敷。", translation: "太守向罗敷道歉（或问讯）。" },
      { char: "遗", meaning: "遗留；送给；丢失", example: "小学而大遗，吾未见其明也。", translation: "小的方面学习，大的方面却遗漏，我看不出他的明智。" },
      { char: "举", meaning: "举起；提出；全、都", example: "举头望明月，低头思故乡。", translation: "抬头看明月，低头思念故乡。" },
      { char: "莫", meaning: "没有谁；不要；不", example: "莫愁前路无知己。", translation: "不要担心前面的路上没有知心朋友。" },
      { char: "未", meaning: "没有；不曾；尚未", example: "肉食者鄙，未能远谋。", translation: "吃肉的人目光短浅，不能作长远打算。" },
      { char: "焉", meaning: "于是；在哪里；语气词", example: "且焉置土石？", translation: "况且把土石放在哪里呢？" },
      { char: "其", meaning: "他的；它的；难道；大概", example: "其如土石何？", translation: "又能把土石怎么样呢？" },
      { char: "之", meaning: "的；他、它；去、往", example: "学而时习之，不亦说乎？", translation: "学习并且按时温习它，不也是很高兴的吗？" },
      { char: "而", meaning: "并且；然后；却", example: "温故而知新，可以为师矣。", translation: "温习旧知识从而知道新知识，就可以做老师了。" },
      { char: "以", meaning: "用；因为；来、用来", example: "不以物喜，不以己悲。", translation: "不因为外物好坏而高兴，不因为自己得失而悲伤。" },
      { char: "于", meaning: "在；向、对；比", example: "苛政猛于虎也。", translation: "苛刻的政令比老虎还要凶猛。" },
      { char: "为", meaning: "做、担任；是；被", example: "人为刀俎，我为鱼肉。", translation: "别人是刀和砧板，我是鱼肉。" },
      { char: "者", meaning: "……的人；……的事物", example: "知之者不如好之者。", translation: "知道它的人不如喜爱它的人。" },
      { char: "也", meaning: "表示判断、陈述或语气", example: "此则岳阳楼之大观也。", translation: "这就是岳阳楼的雄伟景象。" },
      { char: "乎", meaning: "吗；呢；于", example: "不亦说乎？", translation: "不也是很高兴的吗？" }
    ];

    let currentIndex = 0;
    let isFlipped = false;
    let quizIndex = 0;
    let quizAnswered = false;

    function highlightWord(text, word) {
      // 把重点词用红色高亮
      return text.replace(new RegExp(word, 'g'), `<span class="highlight">${word}</span>`);
    }

    function updateCard() {
      const word = words[currentIndex];
      document.getElementById('front-char').textContent = word.char;
      document.getElementById('back-meaning').textContent = word.meaning;
      document.getElementById('back-example').innerHTML = highlightWord(word.example, word.char);
      document.getElementById('back-translation').textContent = word.translation;
      document.getElementById('progress-text').textContent = `第 ${currentIndex + 1} / ${words.length} 个`;

      const card = document.getElementById('flashcard');
      card.classList.remove('flipped');
      isFlipped = false;
    }

    function flipCard() {
      document.getElementById('flashcard').classList.toggle('flipped');
      isFlipped = !isFlipped;
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % words.length;
      updateCard();
    }

    function prevCard() {
      currentIndex = (currentIndex - 1 + words.length) % words.length;
      updateCard();
    }

    function loadQuiz() {
      quizAnswered = false;
      document.getElementById('quiz-result').textContent = '';
      document.getElementById('next-quiz-btn').style.display = 'none';

      const word = words[quizIndex % words.length];
      const question = `「${word.char}」的常见意思是？`;
      const answer = word.meaning;

      document.getElementById('quiz-question').textContent = question;

      let options = [answer];
      while (options.length < 4) {
        const random = words[Math.floor(Math.random() * words.length)];
        if (!options.includes(random.meaning)) {
          options.push(random.meaning);
        }
      }
      options = options.sort(() => Math.random() - 0.5);

      const optionsEl = document.getElementById('quiz-options');
      optionsEl.innerHTML = '';
      options.forEach(opt => {
        const div = document.createElement('div');
        div.className = 'option';
        div.textContent = opt;
        div.onclick = () => selectOption(div, opt, answer);
        optionsEl.appendChild(div);
      });
    }

    function selectOption(el, selected, correct) {
      if (quizAnswered) return;
      quizAnswered = true;
      document.querySelectorAll('.option').forEach(o => {
        o.style.pointerEvents = 'none';
        if (o.textContent === correct) o.classList.add('correct');
      });
      if (selected === correct) {
        el.classList.add('correct');
        document.getElementById('quiz-result').textContent = '✓ 回答正确！';
        document.getElementById('quiz-result').style.color = '#2e7d32';
      } else {
        el.classList.add('wrong');
        document.getElementById('quiz-result').textContent = '✗ 再接再厉';
        document.getElementById('quiz-result').style.color = '#c62828';
      }
      document.getElementById('next-quiz-btn').style.display = 'inline-block';
    }

    function nextQuiz() {
      quizIndex = (quizIndex + 1) % words.length;
      loadQuiz();
    }

    function renderWordList() {
      const list = document.getElementById('word-list');
      document.getElementById('total-count').textContent = `共 ${words.length} 个`;
      list.innerHTML = '';

      words.forEach(w => {
        const item = document.createElement('div');
        item.className = 'word-item';
        item.innerHTML = `
          <div class="word-char">${w.char}</div>
          <div class="word-meaning">${w.meaning}</div>
          <div class="word-example">例句：${highlightWord(w.example, w.char)}</div>
          <div class="word-translation">译文：${w.translation}</div>
        `;
        list.appendChild(item);
      });
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav button').forEach((btn, i) => {
        const names = ['flashcard', 'quiz', 'list'];
        btn.classList.toggle('active', names[i] === tab);
      });

      document.getElementById('flashcard-tab').classList.toggle('hidden', tab !== 'flashcard');
      document.getElementById('quiz-tab').classList.toggle('hidden', tab !== 'quiz');
      document.getElementById('list-tab').classList.toggle('hidden', tab !== 'list');

      if (tab === 'quiz') loadQuiz();
      if (tab === 'list') renderWordList();
      if (tab === 'flashcard') updateCard();
    }

    // 初始化
    updateCard();
  </script>
</body>
</html>
